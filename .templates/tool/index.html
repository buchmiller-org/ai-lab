<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Name — AI Lab</title>
  <meta name="description" content="Description of this standalone tool or visualizer.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <!--
    Clean, modern, zero-dependency styling template for standalone tools and web apps.
    Note: Inline <style> is an intentional single-file starter exception for compact utilities.
    If the tool grows in complexity, feel free to extract to style.css and app.js.
  -->
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    /* Standard AI Lab back navigation link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.15s ease;
    }

    .back-link:hover {
      color: var(--primary);
    }

    header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.025em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 24px;
    }

    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: #0f172a;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 10px 18px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button:hover, .btn:hover {
      background-color: var(--primary-hover);
    }

    input, textarea, select {
      width: 100%;
      background-color: #0b1120;
      border: 1px solid var(--surface-border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--primary);
      outline-offset: -1px;
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="../" class="back-link">← Back to AI Lab</a>

    <header>
      <h1>Tool Title</h1>
      <p class="subtitle">A brief description of what this utility or tool does.</p>
    </header>

    <main>
      <section class="card">
        <!-- Main Tool Content / Interactive UI Goes Here -->
        <p>Tool controls and output interface...</p>
      </section>
    </main>

    <footer>
      <p>Part of <a href="../" style="color: inherit; text-decoration: underline;">AI Lab</a></p>
    </footer>
  </div>

  <script>
    // Tool logic (or split into ./app.js if complex)
  </script>
</body>
</html>
